name: Zadanie 2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the source repo
        uses: actions/checkout@v6

      - name: QEMU set-up
        uses: docker/setup-qemu-action@v4

      - name: Buildx set-up
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata definitions
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=true
          tags: |
            type=sha,priority=100,prefix=sha-,format=short

      # Budowa lokalnego obrazu na potrzeby testów
      - name: Build local image for Trivy
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: local-test-image:latest
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/z2_cache:cache

      # Skaner Trivy (przerywa przy zagrożeniach HIGH lub CRITICAL)
      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-test-image:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Budowanie obrazu wieloplatformowego (uruchomi się tylko, gdy skan będzie czysty)
      - name: Build and push Multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/z2_cache:cache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/z2_cache:cache,mode=max